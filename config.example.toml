# Synthetic example only. Never commit real runtime topology or credentials.
schema_version = 1

[home]
# Probe details are intentionally draft until issue #3 finalizes the schema.
probe_kind = "tcp"
probe_host = "gateway.home.arpa"
probe_port = 443
activator = "manual"

[target]
host = "workstation.home.arpa"
probe_kind = "icmp"

[target.wake]
kind = "udp-wol"
mac = "02:00:00:00:00:01"
broadcast = "192.0.2.255"
port = 9

[ssh]
host = "workstation.home.arpa"
user = "example"
port = 22

[zellij]
session = "work"
remote_shell = "~/.local/bin/skiff-shell"

[timeouts]
home_seconds = 10
host_seconds = 90
ssh_seconds = 30
reconnect_backoff_seconds = 2
